<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chef Nem">
  <title>Chef Nem</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="top">
    <div class="brand"><img src="icons/icon-192.png" alt=""><span id="appName">Chef Nem</span></div>
    <div id="sync" class="sync" aria-live="polite"></div>
  </header>
  <main id="view"></main>
  <nav id="tabs" hidden>
    <button data-tab="plan" aria-label="Plan"><span class="i"><svg viewBox="0 0 24 24" aria-hidden="true">
      <rect class="f2" x="3.5" y="5" width="17" height="15.5" rx="3.5"/>
      <path class="f" d="M3.5 8.5A3.5 3.5 0 0 1 7 5h10a3.5 3.5 0 0 1 3.5 3.5V10h-17z"/>
      <rect class="o" x="3.5" y="5" width="17" height="15.5" rx="3.5"/>
      <path class="o" d="M8 3v4M16 3v4M9 15.2l2 2 4-4"/></svg></span>Plan</button>
    <button data-tab="groceries" aria-label="Groceries"><span class="i"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="f" d="M13.2 10c0-3.4 2.3-5.6 5.8-6-.1 3.4-2.4 5.6-5.8 6z"/>
      <path class="f2 o" d="M3.5 10h17l-1.7 8.3a2.6 2.6 0 0 1-2.5 2.1H7.7a2.6 2.6 0 0 1-2.5-2.1z"/>
      <path class="o" d="M7.5 10l3-5M10 13.5v3.5M14 13.5v3.5"/></svg></span>Groceries</button>
    <button data-tab="recipes" aria-label="Recipes"><span class="i"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="o steam" d="M9.5 2.8q-1.1 1.3 0 2.6t0 2.6M14.5 2.8q-1.1 1.3 0 2.6t0 2.6"/>
      <path class="f2 o" d="M5 12.5h14V16a4.5 4.5 0 0 1-4.5 4.5h-5A4.5 4.5 0 0 1 5 16z"/>
      <rect class="f o" x="3" y="9.6" width="18" height="2.9" rx="1.45"/>
      <path class="o" d="M10 15.8q2 1.6 4 0"/></svg></span>Recipes</button>
    <button data-tab="saved" aria-label="Saved"><span class="i"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="f o" d="M11 5.2l2.3 4.7 5.2.8-3.8 3.7.9 5.2-4.6-2.5-4.7 2.5.9-5.2-3.8-3.7 5.2-.8z"/>
      <path class="f spark" d="M19.5 2.5l.7 1.7 1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7z"/></svg></span>Saved</button>
    <button data-tab="more" aria-label="More"><span class="i"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="f2 o" d="M7 13.5a3.5 3.5 0 0 1 .9-6.9 4.3 4.3 0 0 1 8.2 0 3.5 3.5 0 0 1 .9 6.9z"/>
      <rect class="f o" x="6.5" y="13.5" width="11" height="5.5" rx="1.6"/>
      <circle class="dot" cx="9.6" cy="16.25" r=".95"/><circle class="dot" cx="12" cy="16.25" r=".95"/><circle class="dot" cx="14.4" cy="16.25" r=".95"/></svg></span>More</button>
  </nav>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
